<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Performance Monitor</title>
<style>
/* Tokens: reference palette (validated light + dark). Swap values to match your brand. */
:root{
  color-scheme:light;
  --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --chip:#efeeea;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;               /* categorical slots 1-3 (fixed order) */
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --neutral:#898781;
  --good-text:#006300; --shade:rgba(137,135,129,.12); --evt:rgba(235,104,52,.16); --band:rgba(42,120,214,.10);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --chip:#262624;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --good-text:#0ca30c;
    --shade:rgba(137,135,129,.16); --evt:rgba(217,89,38,.22); --band:rgba(57,135,229,.14);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --chip:#262624;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --good-text:#0ca30c;
  --shade:rgba(137,135,129,.16); --evt:rgba(217,89,38,.22); --band:rgba(57,135,229,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:20px;margin:0 0 2px;font-weight:650}
h2{font-size:16px;margin:0 0 4px;font-weight:650}
h3{font-size:13px;margin:0 0 6px;font-weight:650;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 8px}
.sub{color:var(--ink2)} .muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button,.btn{font:inherit;color:var(--ink);background:transparent;border:0;padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--border);border-radius:8px;background:var(--surface)}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.banner{border:1px solid var(--border);border-left:4px solid var(--warn);background:var(--surface);padding:8px 12px;border-radius:8px;margin-bottom:14px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.card.callout{border-left:4px solid var(--s1)}
.q{display:inline-block;font-size:11px;font-weight:650;color:var(--ink2);background:var(--chip);border-radius:999px;padding:1px 9px;margin-right:6px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile .l{color:var(--ink2);font-size:12px}
.tile .v{font-size:24px;font-weight:650;line-height:1.2;margin:2px 0}
.tile .d{font-size:12px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
/* horizontal bars */
.hb{display:flex;flex-direction:column;gap:2px}
.hrow{display:grid;grid-template-columns:minmax(120px,240px) 1fr minmax(84px,130px);align-items:center;gap:10px;padding:5px 6px;border-radius:8px}
.hrow[data-pick]{cursor:pointer}
.hrow[data-pick]:hover{background:var(--chip)}
.hrow.active{background:var(--chip);box-shadow:inset 3px 0 0 var(--s1)}
.hl{line-height:1.25;overflow-wrap:anywhere}
.hl .sub{display:block;font-size:12px;color:var(--muted)}
.ht{position:relative;height:16px}
.ht .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--axis)}
.ht .bar{position:absolute;top:2px;height:12px;display:block}
.ht .bar.pos{border-radius:0 4px 4px 0}
.ht .bar.neg{border-radius:4px 0 0 4px}
.hv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hv small{display:block;color:var(--muted);font-size:11px}
@media (max-width:620px){.hrow{grid-template-columns:1fr 90px}.hrow .ht{grid-column:1/-1;order:3}}
/* badges (status = icon + label, never color alone) */
.badge{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;white-space:nowrap}
.badge i{font-style:normal;font-size:12px}
.b-critical i{color:var(--crit)} .b-high i{color:var(--serious)} .b-watch i{color:var(--warn)} .b-improved i{color:var(--good)} .b-normal i{color:var(--neutral)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:0;border-top:3px solid}
.legend .sq{width:10px;height:10px;border-radius:2px}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--muted);font-size:11px;font-family:inherit}
/* status board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cell{background:var(--surface);border:1px solid var(--border);border-left-width:4px;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.cell:hover{background:var(--chip)}
.cell .p{font-size:11px;color:var(--muted)} .cell .n{font-weight:600;line-height:1.25} .cell .m{font-size:12px;color:var(--ink2);margin-top:2px}
.c-critical{border-left-color:var(--crit)} .c-high{border-left-color:var(--serious)} .c-watch{border-left-color:var(--warn)} .c-improved{border-left-color:var(--good)} .c-normal{border-left-color:var(--axis)}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink2);font-weight:600;font-size:12px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
ul.tight{margin:0 0 8px;padding-left:18px} ul.tight li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 11px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pri{font-size:11px;font-weight:650;border-radius:6px;padding:1px 8px;background:var(--chip);color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.kv div{background:var(--chip);border-radius:8px;padding:8px 10px} .kv b{display:block;font-size:16px}
.kv span{font-size:12px;color:var(--ink2)}
details{margin-top:8px} summary{cursor:pointer;color:var(--ink2);font-weight:600}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:8px;font-size:12px;line-height:1.35;max-width:300px;opacity:0;transition:opacity .08s}
#tip b{font-weight:650}
@media print{.controls,#tip{display:none}.card{break-inside:avoid}}
</style>
</head>

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('en-US', {maximumFractionDigits: 0});
const sgn = v => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + nf0.format(Math.abs(v));
const gj  = v => v == null ? '–' : nf0.format(v) + ' GJ';
const pct = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + '%';
const idr = v => v == null ? '–' : (v < 0 ? '−' : '') + 'IDR ' + (Math.abs(v) >= 1e9 ? (Math.abs(v)/1e9).toFixed(2) + ' bn' : Math.abs(v) >= 1e6 ? (Math.abs(v)/1e6).toFixed(0) + ' m' : nf0.format(Math.abs(v)));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mlabel = p => p ? MON[+p.slice(5,7)-1] + ' ' + p.slice(2,4) : '';
const STATUS = {
  critical:{label:'Critical', icon:'✖', rank:4}, high:{label:'High', icon:'▲', rank:3},
  watch:{label:'Watch', icon:'◆', rank:2}, improved:{label:'Improved', icon:'✓', rank:1}, normal:{label:'Normal', icon:'●', rank:0}
};
const SCOL = {critical:'var(--crit)', high:'var(--serious)', watch:'var(--warn)', improved:'var(--good)', normal:'var(--neutral)'};
const badge = st => { const s = STATUS[st] || STATUS.normal; return `<span class="badge b-${st}"><i aria-hidden="true">${s.icon}</i>${s.label}</span>`; };
const WIN = {report_month:'Report month', last_3m:'Last 3 months', last_12m:'Last 12 months'};

const state = {tab:'all', win:'last_12m', seu:{}};

/* ---------- tooltip ---------- */
const tipEl = document.getElementById('tip');
function showTip(html, x, y){ tipEl.innerHTML = html; tipEl.style.opacity = 1;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(Math.max(8, x + 14), innerWidth - w - 8) + 'px';
  tipEl.style.top  = Math.min(Math.max(8, y + 14), innerHeight - h - 8) + 'px'; }
const hideTip = () => tipEl.style.opacity = 0;

/* ---------- charts ---------- */
function hbars(rows){
  const vals = rows.map(r => r.value);
  const lo = Math.min(0, ...vals); let hi = Math.max(0, ...vals); if (hi === lo) hi = lo + 1;
  const range = hi - lo, z = (0 - lo) / range * 100;
  return `<div class="hb">` + rows.map(r => {
    const a = Math.min(0, r.value), b = Math.max(0, r.value);
    const left = (a - lo) / range * 100, w = Math.max((b - a) / range * 100, 0.5);
    return `<div class="hrow${r.active ? ' active' : ''}" ${r.id ? `data-pick="${esc(r.id)}" tabindex="0" role="button"` : ''} data-tip="${esc(r.tip || '')}">
      <div class="hl">${r.label}${r.sub ? `<span class="sub">${r.sub}</span>` : ''}</div>
      <div class="ht"><i class="zero" style="left:${z}%"></i><b class="bar ${r.value >= 0 ? 'pos' : 'neg'}" style="left:${left}%;width:${w}%;background:${r.color};opacity:${r.opacity ?? 1}"></b></div>
      <div class="hv">${r.valueText}${r.valueSub ? `<small>${r.valueSub}</small>` : ''}</div></div>`;
  }).join('') + `</div>`;
}
function niceTicks(min, max, n = 4){
  const span = (max - min) || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const out = []; for (let v = Math.floor(min / step) * step; v <= max + step * .5; v += step) out.push(+v.toFixed(10));
  return out;
}
const CHARTS = {};
function lineChart(o){
  const W = 760, H = o.h || 200, L = 60, R = 14, T = 10, B = 26, n = o.x.length;
  let all = o.series.flatMap(s => s.values).filter(v => v != null);
  if (o.band) all = all.concat(o.band.lo.filter(v => v != null), o.band.hi.filter(v => v != null));
  if (o.zero) all.push(0);
  (o.hlines || []).forEach(h => all.push(h.v));
  let mn = Math.min(...all), mx = Math.max(...all);
  const ticks = niceTicks(mn, mx, 4); mn = Math.min(mn, ticks[0]); mx = Math.max(mx, ticks[ticks.length - 1]);
  const X = i => L + (n === 1 ? 0 : i * (W - L - R) / (n - 1)), Y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  let g = '';
  ticks.forEach(t => { g += `<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--grid)"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end">${o.yFmt(t)}</text>`; });
  if (o.zero) g += `<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--axis)"/>`;
  if (o.shadeTo != null && o.shadeTo >= 0) g += `<rect x="${L}" y="${T}" width="${X(o.shadeTo)-L}" height="${H-T-B}" style="fill:var(--shade)"/><text x="${L+6}" y="${T+12}">baseline period</text>`;
  (o.events || []).forEach(e => { g += `<rect x="${X(e.i0)-3}" y="${T}" width="${X(e.i1)-X(e.i0)+6}" height="${H-T-B}" style="fill:var(--evt)" data-tip="${esc(e.tip)}"/>`; });
  if (o.band){ const pts = []; for (let i = 0; i < n; i++) if (o.band.hi[i] != null) pts.push(`${X(i)},${Y(o.band.hi[i])}`);
    for (let i = n - 1; i >= 0; i--) if (o.band.lo[i] != null) pts.push(`${X(i)},${Y(o.band.lo[i])}`);
    g += `<polygon points="${pts.join(' ')}" style="fill:var(--band)"/>`; }
  (o.hlines || []).forEach(h => { g += `<line x1="${L}" x2="${W-R}" y1="${Y(h.v)}" y2="${Y(h.v)}" style="stroke:var(--muted)" stroke-dasharray="4 4"/><text x="${W-R}" y="${Y(h.v)-3}" text-anchor="end">${h.label}</text>`; });
  o.series.forEach(s => { let d = '', pen = false;
    s.values.forEach((v, i) => { if (v == null){ pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
    g += `<path d="${d}" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 4"' : ''} style="stroke:${s.color}"/>`; });
  let xt = ''; o.x.forEach((p, i) => { const m = p.slice(5, 7); if ((n > 18 ? (m === '01' || m === '07') : (n > 8 ? +m % 3 === 1 : true))) xt += `<text x="${X(i)}" y="${H-8}" text-anchor="middle">${mlabel(p)}</text>`; });
  CHARTS[o.id] = {o, X, Y, L, W, R, T, H, B, n};
  const legend = o.series.length > 1 || o.legendExtra ? `<div class="legend">${o.series.map(s => `<span><i class="sw" style="border-color:${s.color};${s.dash ? 'border-top-style:dashed' : ''}"></i>${esc(s.name)}</span>`).join('')}${o.legendExtra || ''}</div>` : '';
  return `${legend}<svg class="ch" id="${o.id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}${xt}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" style="stroke:var(--muted);opacity:0"/>
    <rect class="ov" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg>`;
}
function bindCharts(){
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mousemove', e => showTip(el.getAttribute('data-tip'), e.clientX, e.clientY));
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); showTip(el.getAttribute('data-tip'), r.left + 20, r.top); });
    el.addEventListener('blur', hideTip);
  });
  document.querySelectorAll('svg.ch').forEach(svg => {
    const c = CHARTS[svg.id]; if (!c) return;
    const ov = svg.querySelector('.ov'), xh = svg.querySelector('.xh');
    ov.addEventListener('mousemove', e => {
      const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * c.W;
      const i = Math.max(0, Math.min(c.n - 1, Math.round((mx - c.L) / (c.W - c.L - c.R) * (c.n - 1))));
      xh.setAttribute('x1', c.X(i)); xh.setAttribute('x2', c.X(i)); xh.style.opacity = 1;
      showTip(c.o.tipFmt(i), e.clientX, e.clientY);
    });
    ov.addEventListener('mouseleave', () => { xh.style.opacity = 0; hideTip(); });
  });
  document.querySelectorAll('[data-pick]').forEach(el => {
    const go = () => { const id = el.getAttribute('data-pick'); if (id.includes('|')) { const [p, s] = id.split('|'); state.tab = p; state.seu[p] = s; } else { state.seu[state.tab] = id; } render(); };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

function seuTable(p){
  const rows = p.seus.slice().sort((a, b) => STATUS[b.status].rank - STATUS[a.status].rank).map(s => { const w3 = s.windows.last_3m, m = s.model;
    return `<tr><td><a href="#" data-pick="${esc(s.seu)}" style="color:inherit">${esc(s.seu_name)}</a></td><td>${badge(s.status)}</td><td>${esc(s.pattern.type.replace('_', ' '))}</td><td class="n">${pct(w3.deviation_pct)}</td>
      <td class="n">${nf0.format(s.savings.annualized_excess_gj)}</td><td class="n">${idr(s.savings.annualized_excess_cost_idr)}</td><td class="n">${m.base_load_share_pct.toFixed(0)}%</td><td class="n">${m.r2.toFixed(2)}</td><td class="n">${m.cv_rmse_pct.toFixed(1)}%</td><td>${esc(m.quality)}</td></tr>`; }).join('');
  return `<div class="tw"><table><thead><tr><th>SEU</th><th>Status</th><th>Pattern</th><th class="n">Dev. 3 mo</th><th class="n">Excess GJ/yr</th><th class="n">Excess cost/yr</th><th class="n">Base load</th><th class="n">R²</th><th class="n">CV(RMSE)</th><th>Model</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function appendix(){
  const mt = DATA.method, defs = Object.entries(mt.definitions).map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join('');
  const iso = Object.entries(mt.iso_mapping).map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join('');
  return `<details class="card"><summary>Method, definitions and limitations</summary><h3 style="margin-top:10px">ISO mapping</h3><div class="tw"><table><tbody>${iso}</tbody></table></div>
    <h3 style="margin-top:10px">Definitions</h3><div class="tw"><table><tbody>${defs}</tbody></table></div><h3 style="margin-top:10px">Limitations</h3>${list(mt.limitations)}</details>`;
}

/* ---------- shell ---------- */
function render(){
  const tabs = [['all', 'All plants']].concat(DATA.plants.map(p => [p.plant, p.plant_name]));
  const p = DATA.plants.find(x => x.plant === state.tab);
  document.getElementById('app').innerHTML = `
    <div class="top"><div><h1>Energy performance monitor</h1><div class="sub">ISO 50001 · report month ${mlabel(M.report_month)} · baseline ${mlabel(M.baseline.start)}–${mlabel(M.baseline.end)} · alarm band ±${M.band_pct}% · generated ${esc(M.generated_at)}</div></div>
      <button class="btn" id="theme" aria-label="Toggle light and dark theme">◐ Theme</button></div>
    ${M.data_is_synthetic ? `<div class="banner"><b>Synthetic demo data.</b> Plants, numbers, events and tariffs are invented to demonstrate the method.</div>` : ''}
    <div class="controls"><div class="seg" role="group" aria-label="Plant">${tabs.map(([id, n]) => `<button data-tab="${esc(id)}" aria-pressed="${state.tab === id}">${esc(n)}</button>`).join('')}</div></div>
    ${p ? viewPlant(p) : viewOverview()}${appendix()}`;
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { state.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));
  document.querySelectorAll('[data-win]').forEach(b => b.addEventListener('click', () => { state.win = b.dataset.win; render(); }));
  document.getElementById('theme').addEventListener('click', () => { const r = document.documentElement, dark = getComputedStyle(r).colorScheme === 'dark'; r.setAttribute('data-theme', dark ? 'light' : 'dark'); render(); });
  document.querySelectorAll('a[data-pick]').forEach(a => a.addEventListener('click', e => e.preventDefault()));
  bindCharts();
}
render();
</script>
</body>
</html>
